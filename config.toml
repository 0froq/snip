clipboard_poll_ms = 300
max_cards = 20

[window]
always_on_top = true
visible_on_all_workspaces = true
content_protection = true
frameless = true
panel = true

[card]
# placement: near-selection (default), near-cursor, or fixed
placement = "near-selection"
min_width = 120
max_width = 480
# max_height is gone: height follows max_lines
max_lines = 4
active_color = "#C4784A"
double_click_paste = true
padding_x = 10
padding_y = 6
# font_family: system sans, then a CJK sans for glyphs it lacks
font_family = "-apple-system, PingFang SC, Hiragino Sans GB, sans-serif"
font_size = 14
cascade_origin_x = 24
cascade_origin_y = 24
cascade_step_x = 12
cascade_step_y = 10

language = "en"

[motion]
enabled = true
duration_ms = 160

[leader]
shortcut = "CmdOrCtrl+Shift+Space"
timeout_ms = 1500
double_press_ms = 400
pin_ms = 900
# which_key_corner: top-left, top-right, bottom-left, or bottom-right
which_key_corner = "bottom-right"

[bindings.toggle]
direct = "CmdOrCtrl+Shift+S"
leader = "s"

[bindings.next]
direct = "CmdOrCtrl+Shift+]"
leader = "j"
sticky = true

[bindings.prev]
direct = "CmdOrCtrl+Shift+["
leader = "k"
sticky = true

[bindings.paste]
direct = "CmdOrCtrl+Shift+V"
leader = "v"

[bindings.delete]
direct = "CmdOrCtrl+Shift+Backspace"
leader = "d"

[bindings.pin]
direct = "CmdOrCtrl+Shift+F"
leader = "p"
sticky = true

[bindings.settings]
direct = "CmdOrCtrl+,"
leader = ","

[pasteboard]
honor_concealed = true
skip_transient = true
skip_auto_generated = true

[secrets]
mask_enabled = true
min_entropy_bits = 3.5
min_secret_length = 16
