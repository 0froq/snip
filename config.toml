clipboard_poll_ms = 300
max_cards = 20

[window]
always_on_top = true
visible_on_all_workspaces = true
content_protection = true
frameless = true
panel = true

[card]
# placement: near-selection (default), near-cursor, or fixed
placement = "near-selection"
min_width = 120
max_width = 480
height = 44
max_lines = 2
padding_x = 10
padding_y = 6
font_size = 12
char_width = 7
cascade_origin_x = 24
cascade_origin_y = 24
cascade_step_x = 12
cascade_step_y = 10

[shortcuts]
show_all = "CmdOrCtrl+Shift+S"
hide_all = "CmdOrCtrl+Shift+H"
next = "CmdOrCtrl+Shift+]"
prev = "CmdOrCtrl+Shift+["
paste = "CmdOrCtrl+Shift+V"
delete = "CmdOrCtrl+Shift+Backspace"

[secrets]
mask_enabled = true
min_entropy_bits = 3.5
min_secret_length = 16
