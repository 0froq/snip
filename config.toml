clipboard_poll_ms = 300
max_cards = 20

[window]
always_on_top = true
visible_on_all_workspaces = true
content_protection = true
frameless = true
panel = true

[card]
# placement: near-selection (default), near-cursor, or fixed
placement = "near-selection"
min_width = 120
max_width = 480
height = 44
max_height = 220
line_height = 18
max_lines = 2
active_color = "#C4784A"
padding_x = 10
padding_y = 6
font_size = 12
char_width = 7
cascade_origin_x = 24
cascade_origin_y = 24
cascade_step_x = 12
cascade_step_y = 10

language = "en"

[motion]
enabled = true
duration_ms = 160

[shortcuts]
direct = true
toggle = "CmdOrCtrl+Shift+S"
next = "CmdOrCtrl+Shift+]"
prev = "CmdOrCtrl+Shift+["
paste = "CmdOrCtrl+Shift+V"
delete = "CmdOrCtrl+Shift+Backspace"
pin = "CmdOrCtrl+Shift+F"
settings = "CmdOrCtrl+,"

[leader]
shortcut = "CmdOrCtrl+Shift+Space"
timeout_ms = 1500
toggle = "s"
next = "j"
prev = "k"
paste = "v"
delete = "d"
pin = "p"
settings = ","
double_press_ms = 400
pin_ms = 900

[pasteboard]
honor_concealed = true
skip_transient = true
skip_auto_generated = true

[secrets]
mask_enabled = true
min_entropy_bits = 3.5
min_secret_length = 16
