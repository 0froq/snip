clipboard_poll_ms = 300
max_cards = 20

[window]
always_on_top = true
visible_on_all_workspaces = true
content_protection = true
frameless = true
panel = true

[card]
# placement: near-selection (default), near-cursor, or fixed
placement = "near-selection"
min_width = 120
max_width = 480
max_height = 220
# max_lines is ignored. Older files that still set it continue to load.
active_color = "#C4784A"
double_click_paste = true
padding_x = 10
padding_y = 6
# font_family: system sans, then a CJK sans for glyphs it lacks
font_family = "-apple-system, PingFang SC, Hiragino Sans GB, sans-serif"
font_size = 14
cascade_origin_x = 24
cascade_origin_y = 24
cascade_step_x = 12
cascade_step_y = 10

language = "en"

[theme]
# auto follows the system appearance (Autumn Day / Autumn Night).
# Or spring-day, spring-night, summer-day, summer-night,
# autumn-day, autumn-night, winter-day, winter-night.
palette = "auto"

[capture]
# mode: all (default), blocklist, or allowlist. Lists store bundle ids.
mode = "all"
blocklist = []
allowlist = []

[motion]
enabled = true
duration_ms = 160

[leader]
timeout_ms = 1500
double_press_ms = 400
# which_key_x/y: 0..100 percent of the work area. align is which point of the
# panel sits there: start (left/top), center, or end (right/bottom).
which_key_x = 100
which_key_y = 100
which_key_align_x = "end"
which_key_align_y = "end"

# A shortcut is a global combo, or "leader" plus a key pressed after the leader key.
# stay keeps leader mode open after that key.
[[bindings]]
action = "leader"
keys = "CmdOrCtrl+Shift+Space"

[[bindings]]
action = "toggle"
keys = "CmdOrCtrl+Shift+S"

[[bindings]]
action = "toggle"
keys = "leader s"

[[bindings]]
action = "next"
keys = "CmdOrCtrl+Shift+]"

[[bindings]]
action = "next"
keys = "leader j"
stay = true

[[bindings]]
action = "prev"
keys = "CmdOrCtrl+Shift+["

[[bindings]]
action = "prev"
keys = "leader k"
stay = true

[[bindings]]
action = "paste"
keys = "CmdOrCtrl+Shift+V"

[[bindings]]
action = "paste"
keys = "leader v"

[[bindings]]
action = "delete"
keys = "CmdOrCtrl+Shift+Backspace"

[[bindings]]
action = "delete"
keys = "leader d"

[[bindings]]
action = "clear_cards"
keys = "CmdOrCtrl+Shift+Option+Backspace"

# Shift+D, not "D": a single letter is case-insensitive in the shortcut parser.
[[bindings]]
action = "clear_cards"
keys = "leader Shift+D"

[[bindings]]
action = "pin"
keys = "CmdOrCtrl+Shift+F"

[[bindings]]
action = "pin"
keys = "leader p"
stay = true

[[bindings]]
action = "settings"
keys = "CmdOrCtrl+,"

[[bindings]]
action = "settings"
keys = "leader ,"

[pasteboard]
honor_concealed = true
skip_transient = true
skip_auto_generated = true

[secrets]
mask_enabled = true
min_entropy_bits = 3.5
min_secret_length = 16
